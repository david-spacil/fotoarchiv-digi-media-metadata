# Klient pro import z telefonu: testy (včetně okna bez displeje)
# a spustitelný soubor PyInstaller jako artefakt workflow. Zatím jen
# Linux; zdroj pro Windows ještě není.
name: Klient

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["klient/**", "tests/test_klient*.py",
            ".github/workflows/klient.yml"]
  pull_request:
    paths: ["klient/**", "tests/test_klient*.py",
            ".github/workflows/klient.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    # Starší glibc, aby binárka běžela i na starších distribucích.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libimage-exiftool-perl libegl1 libxkbcommon0 libfontconfig1 \
            libdbus-1-3
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r klient/requirements.txt pytest
      - run: python -m pytest -q tests/test_klient.py tests/test_klient_ui.py
        env:
          QT_QPA_PLATFORM: offscreen
      - run: >
          pyinstaller --onefile --windowed --name fotoarchiv-klient
          --paths . klient/spustit.py
      - uses: actions/upload-artifact@v4
        with:
          name: fotoarchiv-klient-linux
          path: dist/fotoarchiv-klient
